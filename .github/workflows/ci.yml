name: ci

# No API key and no network: every check here is offline by design, so a contributor
# without provider credentials still gets the guards that matter.
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      # Admission decisions are a pure function of tokens and prices, so drift in the
      # controller is catchable without spending a cent.
      - run: uv run python scripts/simulate_admission.py haiku 300 2 0
